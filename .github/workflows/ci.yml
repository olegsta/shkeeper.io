name: ci

on:
  push:
    branches: [main]

  repository_dispatch:
    types: [build-multiskipper]

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ -z "${{ github.event.client_payload.tag }}" ]; then
              echo "Error: repository_dispatch requires client_payload.tag" >&2
              exit 1
            fi

            TAG="${{ github.event.client_payload.tag }}"
            VERSION="${TAG#v}"

            echo "SHKEEPER_IMAGE=vsyshost/shkeeper:${VERSION}" >> "$GITHUB_ENV"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"

            if [ -z "$VERSION" ]; then
              echo "Error: could not read version from pyproject.toml" >&2
              exit 1
            fi
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=ghcr.io/olegsta/shkeeper-multishkeeper:${VERSION}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push from shkeeper.io tag
        if: github.event_name == 'repository_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            SHKEEPER_IMAGE=${{ env.SHKEEPER_IMAGE }}

      - name: Build and push from main
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE_TAG }}